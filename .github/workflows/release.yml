name: Release

# A tag `vX.Y.Z` matching the pubspec version builds signed Android APKs and an unsigned iOS IPA, and publishes them as a GitHub release.
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of the upload/release .jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Check tag matches pubspec version
        run: |
          pubspec_version=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+]+).*/\1/')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pubspec_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $pubspec_version"
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

  android:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release

      - name: Rename artifacts
        run: |
          v=${{ needs.verify-version.outputs.version }}
          cd build/app/outputs/flutter-apk
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for f in app-*-release.apk; do
            abi=${f#app-}; abi=${abi%-release.apk}
            cp "$f" "$GITHUB_WORKSPACE/dist/puffer-$v-$abi.apk"
          done
          cp app-release.apk "$GITHUB_WORKSPACE/dist/puffer-$v-universal.apk"
          cd "$GITHUB_WORKSPACE/dist" && sha256sum *.apk > SHA256SUMS-android.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  ios:
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          v=${{ needs.verify-version.outputs.version }}
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "dist/puffer-$v-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*

  publish:
    needs: [verify-version, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Find changelog
        id: changelog
        run: |
          code=$(grep -E '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          f="fastlane/metadata/android/en-US/changelogs/$code.txt"
          if [ -f "$f" ]; then echo "file=$f" >> "$GITHUB_OUTPUT"; fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ steps.changelog.outputs.file }}
          generate_release_notes: ${{ steps.changelog.outputs.file == '' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
